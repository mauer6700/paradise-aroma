<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paradise Aroma — оптовый каталог</title>
<meta name="description" content="Paradise Aroma: масла на разлив и стоп-лист парфюмерии, заказ штучно.">
<style>
:root{--g:#0a9d7c;--gd:#07775f;--r:16px;--bg:#f6f6f3;--bg2:#e4efe9;--card:#fff;--sub:#f2f2ef;--thumb:#fafaf8;--ink:#111;--ink2:#333;--line:#e7e6e0;--muted:#7a7a74;--red:#e0433a;--soft:#ecf7f3;--onacc:#fff;--redsoft:#fbebea;--redline:#f1c3c0;--navbg:rgba(255,255,255,.7);color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:#0e100f;--bg2:#0b1b17;--card:#171a18;--sub:#222622;--thumb:#1f2320;--ink:#f1f1ed;--ink2:#dcdcd6;--line:#2c312d;--muted:#9a9d96;--soft:#17332b;--onacc:#fff;--redsoft:#3a1f1e;--redline:#5a2b29;--navbg:rgba(28,32,30,.72)}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.brandbar{display:flex;align-items:center;justify-content:space-between;height:56px}
.langsw{display:flex;gap:4px;background:var(--sub);border-radius:999px;padding:3px}
.langsw button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;padding:6px 9px;border-radius:999px;cursor:pointer}
.langsw button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.16em;font-size:14px}
.mark{width:32px;height:32px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:12px}
.brand small{display:block;font-size:9px;letter-spacing:.4em;color:var(--muted);font-weight:500}
.titlerow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 4px}
.titlerow h1{font-size:20px;white-space:nowrap;margin:0;font-weight:800;letter-spacing:-.01em}
.titlerow h1 span{font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}
.sortsel{border:0;background:transparent;color:var(--g);font-weight:700;font-size:13px;padding:6px 0;cursor:pointer;max-width:42%;min-width:0;text-overflow:ellipsis}
.searchrow{display:flex;gap:8px;align-items:center;padding:6px 0 10px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--sub);border-radius:999px;padding:0 14px;height:40px}
.search input{border:0;background:transparent;flex:1;min-width:0;font-size:15px;outline:none;color:var(--ink)}
.iconbtn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;border:0;background:var(--sub);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn.on{background:var(--g);color:var(--onacc)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.pill.on{background:var(--g);border-color:var(--g);color:var(--onacc);font-weight:600}
.catsw{display:flex;gap:0;background:#ebebe6;border-radius:12px;padding:4px;margin-bottom:10px}
.catsw button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:600}
.catsw button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.legend{font-size:13px;color:var(--muted);margin:4px 0 12px}
.grid{display:grid;gap:16px;padding-bottom:24px}
.grid.list{grid-template-columns:1fr}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line);display:flex;gap:14px;min-width:0}
.grid.c2 .card,.grid.c3 .card{flex-direction:column;gap:10px;padding:10px}
.grid.c3 .card{padding:8px}
.thumb{flex:0 0 118px;height:150px;background:var(--thumb);border-radius:12px;display:grid;place-items:center;overflow:hidden}
.thumb svg{width:82%;height:92%}
.thumb{padding:6px;box-sizing:border-box}
.thumb img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;background:transparent}
.grid.c2 .thumb,.grid.c3 .thumb{flex:none;width:100%;height:auto;aspect-ratio:1/1.1}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.name{font-weight:800;font-size:16px;line-height:1.2}
.grid.c3 .name{font-size:12px}
.grid.c2 .name{font-size:14px}
.sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price{font-weight:800;font-size:18px}
.grid.c3 .price{font-size:13px}
.price small{font-size:12px;color:var(--muted);font-weight:500}
.stock{align-self:flex-start;font-size:12px;font-weight:600;color:var(--gd);background:var(--soft);border:1px solid #bfe3d7;border-radius:999px;padding:3px 10px}
.stock.no{color:var(--red);background:var(--redsoft);border-color:var(--redline)}
.stock.no:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle}
.stock:not(.no):before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:6px;vertical-align:middle}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid.c3 .chips{grid-template-columns:1fr}
.chip{border:1.5px solid var(--muted);background:var(--card);border-radius:999px;padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);text-align:center;white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:var(--onacc)}
.chip:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;border-radius:8px;padding:4px 9px;background:#2e2e2b;color:var(--onacc)}
.tag.alt{background:#7a4f1e}
.tag.sup{background:#2b4a8a}
.buyrow{display:flex;gap:8px;margin-top:auto;align-items:center}
.step{display:flex;align-items:center;border:1.5px solid var(--g);border-radius:12px;height:44px;overflow:hidden;flex:0 0 auto}
.step button{width:34px;height:100%;border:0;background:var(--card);color:var(--g);font-size:20px;cursor:pointer;line-height:1}
.step input{width:44px;height:100%;border:0;text-align:center;font-size:16px;font-weight:700;color:var(--ink);background:var(--card);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.addbtn{flex:1;min-width:0;height:44px;border:0;border-radius:12px;background:var(--g);color:var(--onacc);font-weight:700;font-size:14px;cursor:pointer;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addbtn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.grid.c3 .addbtn{font-size:12px;padding:0 4px}
.grid.c2 .buyrow{flex-wrap:wrap}
.grid.c2 .addbtn{flex:1 1 100%;order:2}
.grid.c2 .step{order:1}
.grid.c3 .step button{width:26px}
.grid.c3 .step input{width:34px}
.grid.c3 .step{height:40px}
.grid.c3 .addbtn{height:40px}
.sumline{font-size:13px;color:var(--muted)}
.sumline b{color:var(--ink);font-size:15px}
.grp{grid-column:1/-1;font-size:20px;font-weight:800;padding:14px 2px 8px;border-bottom:3px solid var(--g);margin-top:6px}
.pills .pill.on{background:var(--g)}
.card{text-align:left}
.card .tags{justify-content:center}
.card .name{text-align:center;font-weight:800;font-size:15px;line-height:1.25}
.card .sub{text-align:center;font-size:12px;color:var(--muted)}
.card .price{text-align:center;font-weight:800;font-size:17px}
.card .price small{font-size:12px;color:var(--muted);font-weight:500}
.card .stock{align-self:center}
.card .buyrow{flex-wrap:wrap}
.card .step{flex:1 1 100%;width:100%;justify-content:space-between}
.card .step input{flex:1;width:auto;min-width:0}
.card .addbtn{flex:1 1 100%;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.card .chips{margin-top:2px}
.grid.c3 .card .addbtn{font-size:12px;height:40px}
.grid.c3 .card .step{height:40px}
.grid.c3 .card .step input{width:auto}
.cbrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.cbrow::-webkit-scrollbar{display:none}
.cb{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
.cb .cbx{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;display:inline-grid;place-items:center;font-size:11px;color:var(--onacc);font-weight:900;background:var(--card)}
.cb.on{border-color:var(--g);background:var(--soft)}
.cb.on .cbx{background:var(--g);border-color:var(--g)}
.cb i{font-style:normal;color:var(--muted);font-size:12px}
.fmtsel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}
.fbtn{border:1px solid var(--line);background:var(--sub);color:var(--ink);border-radius:12px;padding:10px 6px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;line-height:1.2}
.fbtn small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.fbtn.on{background:var(--g);border-color:var(--g);color:var(--onacc)}
.fbtn.on small{color:#dff3ec}
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.chips3 .chip{padding:6px 2px;font-size:12px}
.card .thumb{height:104px}
.grid.c3 .card .thumb{height:72px}
.card .name{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.grid.c3 .card .name{font-size:12px;min-height:0}
.card .sub{font-size:11px}
.card .price{font-size:15px}
.grid.c3 .card .price{font-size:13px}
.card .buyrow{flex-direction:column;align-items:stretch;gap:6px}
.card .step{width:100%;height:36px}
.card .addbtn{width:100%;height:38px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:visible}
.grid.c3 .card .addbtn{font-size:12px;height:34px;padding:0 2px;gap:3px}
.grid.c3 .card .step{height:32px}
.grid.c3 .card .step button{width:24px}
.grid.c3 .card .step input{width:auto;font-size:13px}
.cat.photo{background-size:cover;background-position:center;color:var(--onacc)}
.cat.photo:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.65))}
.cat.photo .lbl{position:relative;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.sethero{height:210px;border-radius:18px;margin:4px 0 12px;background-image:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.75)),var(--photo);background-size:cover;background-position:center;color:var(--onacc);display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.sethero b{font-size:24px}
.sethero span{font-size:14px;opacity:.9}
.grid.list .card{flex-direction:row;align-items:flex-start;gap:12px}
.grid.list .card .thumb{flex:0 0 112px;width:112px;height:128px;min-width:0}
.grid.list .card .info{flex:1 1 0;min-width:0;width:auto}
.grid.list .card .chips3{grid-template-columns:repeat(3,1fr)}
html,body{overflow-x:hidden;max-width:100%}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.list{grid-template-columns:minmax(0,1fr)}
.card{min-width:0}
.card .info{min-width:0}
.card .step{display:flex;align-items:center;min-width:0}
.card .step input{flex:1 1 0;width:0;min-width:0;padding:0}
.card .step button{flex:0 0 auto}
.card .addbtn{min-width:0;max-width:100%}
.card .price,.card .name,.card .sub{overflow-wrap:anywhere;min-width:0}
.card .chips3{min-width:0}
.titlerow h1{white-space:normal}
.dpills{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.dpills::-webkit-scrollbar{display:none}
.dpill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:0;background:#ececea;border-radius:999px;padding:11px 16px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;white-space:nowrap}
.dpill.on{background:#d6e6df;color:var(--gd);font-weight:600}
.panelbox{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 12px}
.card .thumb.photo{height:120px;padding:0;overflow:hidden}
.card .thumb.photo img{width:100%;height:100%;object-fit:cover;display:block}
.grid.c3 .card .thumb.photo{height:84px}
.card .buyrow,.grid .card .buyrow{flex-direction:column !important;flex-wrap:nowrap !important;align-items:stretch;gap:6px;flex-shrink:0 !important;margin-top:auto}
.card .step,.card .addbtn{flex-shrink:0}
.card .info{display:flex;flex-direction:column;gap:7px;flex:0 0 auto;min-width:0}
.card .buyrow{height:auto !important;min-height:0}
.card .step{flex:0 0 36px !important;height:36px !important}
.card .addbtn{flex:0 0 38px !important;height:38px !important}
.grid.c3 .card .addbtn{flex:0 0 34px !important;height:34px !important}
.grid.c3 .card .step{flex:0 0 32px !important;height:32px !important}
.card .info{flex:0 0 auto !important}
.grid.list .card .info{flex:1 1 0 !important;width:0 !important;min-width:0 !important}
body{overflow-x:clip}
html{overflow-x:hidden}
.card{background:var(--cbg,var(--card))}
.card .thumb{background:var(--cth,var(--thumb))}
.addbtn{background:var(--cacc,var(--g));color:var(--cfg,#fff)}
.addbtn[disabled]{background:var(--line);color:var(--muted)}
.card .chip.on{background:var(--cacc,var(--g));border-color:var(--cacc,var(--g));color:var(--cfg,#fff)}
.card .step button{color:var(--cacc,var(--g));border-color:var(--cacc,var(--g))}
.card .step{border-color:var(--cacc,var(--g))}
.sublbl{font-size:12px;color:#3b3b38;font-weight:600;margin-top:-2px;background:rgba(255,255,255,.7);border-radius:8px;padding:3px 7px}
.liq{animation:flow 2.8s linear infinite}
.liq2{animation:flow2 4.2s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes flow2{from{transform:translateX(-30px)}to{transform:translateX(-90px)}}
.stickytop{position:sticky;top:56px;z-index:12;margin:0 -14px;padding:0 14px 4px;background:var(--bg);box-shadow:0 6px 12px -10px rgba(0,0,0,.28)}
.dpwrap{position:relative}
.dpills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.dpills::-webkit-scrollbar{display:none}
.dpill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.dpill.on{border-color:var(--g);background:var(--soft);color:var(--g);font-weight:600}
.ddmenu{position:absolute;top:calc(100% + 4px);left:0;min-width:240px;max-width:calc(100% + 40px);max-height:60vh;overflow:auto;z-index:30;background:var(--card);border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.18);padding:6px 0}
.ddi{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;padding:13px 18px;font:inherit;font-size:16px;color:var(--ink);text-align:left;cursor:pointer}
.ddi.on{font-weight:700}
.ddi+.ddi{border-top:1px solid var(--line)}
.ddl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ddr{display:flex;align-items:center;gap:10px;flex:0 0 auto;color:var(--muted);font-size:13px}
.ddr small{font-size:12px}
.ddc{width:18px;height:18px;display:inline-grid;place-items:center;color:var(--g)}
.stickytop .panelbox{max-height:38vh;overflow:auto}

.stickytop.tuck{padding-bottom:6px}
html,body,.stickytop,.grid{overflow-anchor:none}
#modalRoot{position:fixed;inset:0;z-index:60;pointer-events:none}
#modalRoot:empty{display:none}
.mback,.mbox,.mclose{pointer-events:auto}
.mback{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,94vw);max-height:92vh;overflow:auto;background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mclose{position:absolute;right:10px;top:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;cursor:pointer;line-height:1}
.mimgwrap{background:var(--thumb);display:grid;place-items:center}

.fprices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}

const LAYOUT = {};
(function(){
  const ru = "йцукенгшщзхъё" + "фывапролджэ" + "ячсмитьбю.";
  const en = "qwertyuiop[]`" + "asdfghjkl;'" + "zxcvbnm,./";

})();
function swapLayout(str){ return [...str.toLowerCase()].map(c=>LAYOUT[c]||c).join(""); }
function normText(str){ return String(str||"").toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-яёәғқңөұүһі0-9]+/g," ").trim(); }
const CYR2LAT = {ә:"a",ғ:"g",қ:"k",ң:"n",ө:"o",ұ:"u",ү:"u",һ:"h",і:"i",а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"e",ж:"zh",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ы:"y",э:"e",ю:"yu",я:"ya",ь:"",ъ:""};
// Skeleton: latin letters only, vowels and doubled letters removed, so "крид" and "creed" both become "krd"
function skel(str){
  let t = [...normText(str)].map(c=>CYR2LAT[c]??c).join("").replace(/ /g,"");
  t = t.replace(/sch|sh|ch|zh/g,"s").replace(/ph/g,"f").replace(/th/g,"t").replace(/ck|q/g,"k")
       .replace(/c/g,"k").replace(/w/g,"v").replace(/x/g,"ks").replace(/z/g,"s").replace(/h/g,"");
  const head = t.charAt(0);
  const body = t.slice(1).replace(/[aeiouy]/g,"");
  return (head + body).replace(/(.)\1+/g,"$1");
}
function matchesQuery(x, fuzzy){
  const raw = S.q.trim();
  if(!raw) return true;
  const hay = normText(x.name + " " + (x.ru||"") + " " + (x.sup||""));
  const variants = [normText(raw), normText(swapLayout(raw))];
  if(variants.some(v => v && hay.includes(v))) return true;
  if(skelMatch(raw, x.name + " " + (x.ru||"") + " " + (x.sup||""))) return true;
  return !!fuzzy && fuzzyMatch(raw, x);
}
function toLatin(str){ return [...normText(str)].map(c=>CYR2LAT[c]??c).join(""); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
// every word typed must be found in the item, allowing small typos and any position
function fuzzyMatch(raw, x){
  const toks = toLatin(raw).split(" ").filter(Boolean);
  if(!toks.length) return false;
  const hw = toLatin(x.name+" "+(x.ru||"")+" "+(x.sup||"")).split(" ").filter(Boolean);
  return toks.every(tk=>{
    if(tk.length<3) return hw.some(w=>w.startsWith(tk));
    const lim = tk.length<=4 ? 1 : tk.length<=7 ? 1 : 2;
    return hw.some(w => w.includes(tk) || (w[0]===tk[0] && (lev(tk,w)<=lim || (w.length>tk.length && lev(tk,w.slice(0,tk.length))<=lim))));
  });
}
// every word of the query must match a word of the item (same skeleton, or a longer word that starts with it)

const BRAND_RU = {гермес:"hermes",ксерджоф:"xerjoff",амуаж:"amouage",баккара:"baccarat",кинкаджу:"kurkdjian",кёркджиан:"kurkdjian",эрмес:"hermes",сервант:"servant",бакарат:"baccarat",ланком:"lancome",версаче:"versace",армани:"armani",шанель:"chanel",диор:"dior",кристиан:"christian",бвлгари:"bvlgari",булгари:"bvlgari",кельвин:"calvin",клайн:"klein",гуччи:"gucci",прада:"prada",карамель:"caramel"};
function skelMatch(q, text){
  const qw = normText(q).split(" ").map(w=>BRAND_RU[w]||w).map(skel).filter(w=>w.length>=2);
  if(!qw.length) return false;
  const hw = normText(text).split(" ").map(skel).filter(Boolean);
  return qw.every(a => hw.some(b => b===a || (a.length>=3 && b.startsWith(a))));
}
function filtered(list){
  const byGender = list.filter(x => (S.g==="all"||x.g===S.g));
  const exact = byGender.filter(x => matchesQuery(x, false));
  // typo-tolerant search is used only when nothing matches exactly
  if(exact.length || !S.q.trim()) return exact;
  return byGender.filter(x => matchesQuery(x, true));
}
function sortOils(list){
  const a=[...list];
  if(S.sort==="name") a.sort((x,y)=>x.sup.localeCompare(y.sup,"en") || x.name.localeCompare(y.name,"en",{sensitivity:"base"}));
  if(S.sort==="priceAsc") a.sort((x,y)=>(x.l??1e12)-(y.l??1e12));
  if(S.sort==="priceDesc") a.sort((x,y)=>(y.l??-1)-(x.l??-1));
  return a;
}

function tint(h,a){ const c=hexRgb(h); return `rgb(${c.map(v=>Math.round(v*a+255*(1-a))).join(',')})`; }
function textOn(h){ const [r,g,b]=hexRgb(h); return (0.299*r+0.587*g+0.114*b)>165 ? "#111" : "#fff"; }
function labelOf(name){ const b=brandOf(name); return b==="Другие" ? name.split(" ").slice(0,2).join(" ") : b; }
function cardColor(name){ return COLOR_MAP[name] || BRAND_COLOR[brandOf(name)] || "#7d7d78"; }
function cardVars(name){ return ""; }
function wavePath(){
  let d = "M-120 0";
  for(let x=-120; x<300; x+=60) d += " q15 -6 30 0 t30 0";
  return d + " L300 140 L-120 140 Z";
}

function sideBar(base){
  const isOils = S.cat==="oils";
  let h = "";
  if(!isOils){
    h += `<div class="sgrp"><h5>${t("format")}</h5>` + FMT.map((f,i)=>`<button type="button" class="sck ${i===S.fmt?"on":""}" data-fmt="${i}"><i class="rad"></i><span>${f}</span></button>`).join("") + `</div>`;
  }
  const sel = isOils ? S.supp : S.brands;
  const key = isOils ? "supp" : "brands";
  const opts = countBy(base, isOils ? x=>x.sup : x=>brandOf(x.name));
  const open = !!S.bopen;
  h += `<div class="sgrp"><button type="button" class="sghead ${open?"open":""}" data-sidetog="1" aria-expanded="${open}"><span>${isOils ? t("supplier") : t("brand")}</span><span class="sgval">${sel.size===0 ? t("all") : sel.size}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>`;
  if(open){
    h += `<button type="button" class="sck ${sel.size===0?"on":""}" data-fall="1"><i></i><span>${t("all")}</span></button>`
       + opts.map(([n,c])=>`<button type="button" class="sck ${sel.has(n)?"on":""}" data-fopt="${key}" data-fval="${esc(n)}"><i></i><span>${esc(n)}</span><small>${c}</small></button>`).join("");

const FILTER_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg>';
const CHECK_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const GENDER_OPTS = {get list(){ return [["all",t("all")],["M",t("g.M")],["W",t("g.W")],["U",t("g.U")]]; }};
function ddItem(on, label, sub, attrs){
  return `<button type="button" class="ddi ${on?"on":""}" ${attrs}><span class="ddl">${label}</span><span class="ddr">${sub?`<small>${sub}</small>`:""}<span class="ddc">${on?CHECK_SVG:""}</span></span></button>`;
}
function dpill(key,label,on){
  return `<button type="button" class="dpill ${on?"on":""}" data-panel="${key}">${label}${CHEVRON}</button>`;
}
function filterBar(base){
  if(!S.showFilters || S.cat==="sets") return "";
  const isOils = S.cat==="oils";
  const brandN = isOils ? S.supp.size : S.brands.size;
  const brandLabel = isOils ? t("supplier") : t("brand");
  const genderLabel = (GENDER_OPTS.list.find(([v])=>v===S.g)||[,t("gender")])[1];
  let pills = "";
  if(!isOils) pills += dpill("fmt", FMT[S.fmt], S.panel==="fmt");
  pills += dpill("brand", brandLabel+(brandN?" · "+brandN:""), brandN>0 || S.panel==="brand");
  pills += dpill("gender", S.g==="all"?t("gender"):genderLabel, S.g!=="all" || S.panel==="gender");
  let menu = "";
  if(S.panel==="fmt"){
    menu = FMT.map((f,i)=>ddItem(i===S.fmt, f, `${STOP_PRICE[i].p} ₸ · ${STOP_PRICE[i].ml} мл`, `data-fmt="${i}"`)).join("");
  } else if(S.panel==="brand"){
    const sel = isOils ? S.supp : S.brands;
    const opts = countBy(base, isOils ? x=>x.sup : x=>brandOf(x.name));
    const key = isOils ? "supp" : "brands";
    menu = ddItem(sel.size===0, t("all"), "", `data-fall="1"`)
      + opts.map(([n,c])=>ddItem(sel.has(n), esc(n), String(c), `data-fopt="${key}" data-fval="${esc(n)}"`)).join("");
  } else if(S.panel==="gender"){
    menu = GENDER_OPTS.list.map(([v,l])=>ddItem(S.g===v, l, "", `data-gsel="${v}"`)).join("");
  }
  const box = menu ? `<div class="ddmenu">${menu}</div>` : "";
  return `<div class="dpwrap"><div class="dpills">${pills}</div>${box}</div>`;
}
function countBy(list, fn){
  const m = new Map();
  list.forEach(x=>{ const b = fn(x); m.set(b,(m.get(b)||0)+1); });
  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],"ru"));
}

function viewCatalog(){
  const TITLES = {oils:t("c.oils"), stop:t("c.stop"), acc:t("c.acc"), sets:t("c.sets")};
  const cat = S.cat;
  let top = "", side = "", body = "", count = 0, sortHtml = "<span></span>", hero = "";
  if(cat==="oils"){
    const base = filtered(oils);
    side = S.showFilters ? sideBar(base) : "";
    const items = sortOils(base.filter(x=>S.supp.size===0 || S.supp.has(x.sup)));
    count = items.length;
    sortHtml = `<select class="sortsel" id="sort" aria-label="Сортировка">
      <option value="name" ${S.sort==="name"?"selected":""}>По поставщику</option>
      <option value="priceAsc" ${S.sort==="priceAsc"?"selected":""}>Цена за литр ↑</option>
      <option value="priceDesc" ${S.sort==="priceDesc"?"selected":""}>Цена за литр ↓</option></select>`;
    let last = "";
    body = items.map(x=>{ const h = (S.sort==="name" && x.sup!==last) ? grp(t("supplier")+" "+x.sup) : ""; last = x.sup; return h + (S.mode==="rows" ? rowOil(x) : oilCard(x)); }).join("");
    if(S.mode==="rows") body = rowsHead() + body;
  } else if(cat==="stop"){
    const base = filtered(stops);
    side = S.showFilters ? sideBar(base) : "";
    const items = base.filter(x=>S.brands.size===0 || S.brands.has(brandOf(x.name)))
      .sort((a,b)=>a.name.localeCompare(b.name,"en",{sensitivity:"base"}));
    count = items.length;
    let last = "";
    body = items.map(x=>{ const L = x.name[0].toUpperCase(); const h = L!==last ? grp(L) : ""; last = L; return h + (S.mode==="rows" ? rowStop(x) : stopCard(x)); }).join("");
    if(S.mode==="rows") body = rowsHead() + body;
  } else if(cat==="sets"){
    hero = `<div class="sethero" style="--photo:url('${SETS_PHOTO}')"><b>Наборы</b><span>Готовые наборы с подставкой в подарок</span></div>`;
    count = SETS.length;
    body = SETS.map((_,i)=>setCard(i)).join("");
  }
  if(!body){
    const soon = cat==="acc";
    body = `<div class="soonbox box" style="grid-column:1/-1">${soon
      ? "<b>Раздел в разработке</b><br>Товары этого раздела скоро появятся. Пришлите прайс в WhatsApp, и мы добавим их сюда."
      : "Ничего не найдено. Попробуйте другой запрос."}</div>`;
  }
  const catPills = [["oils",t("c.oils")],["stop",t("c.stop")],["acc",t("c.acc")],["sets",t("c.sets")]]
    .map(([v,l])=>`<button type="button" class="pill ${cat===v?"on":""}" data-cat="${v}">${l}</button>`).join("");
  return `
  ${hero}
  <div class="stickytop${S.tuck?" tuck":""}">${minInfo()}
  ${top}
  <div class="searchrow">
    <label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" placeholder="${t('search')}" value="${S.q.replace(/"/g,"&quot;")}"></label>
    <button type="button" class="iconbtn ${S.mode!=="c2"?"on":""}" data-cycle="1" aria-label="Вид списка">${modeIcon()}</button>
    <button type="button" class="iconbtn ${S.showFilters?"on":""}" data-toggle="1" aria-label="Фильтры">${FILTER_SVG}</button>
  </div>
  <div class="titlerow"><h1>${TITLES[cat]}<span>${count}</span></h1>${sortHtml}</div>
  </div>
  <div class="shell"><aside class="side">${catRail()}${side}</aside><div class="main"><div class="${gridClass()}">${body}</div></div></div>`;
}

function cartLines(){
  return Object.entries(cart).map(([k,c])=>{
    if(k[0]==="o"){
      const o = oils[c.i];
      return {k, type:"o", name:o.name, sub:o.sup, q:c.q, unit:"мл", sum: oilPrice(o, c.q)};
    }
    if(k[0]==="n"){ const st = SETS[c.i]; return {k, type:"n", name:st.name, sub:"Набор", q:c.q, unit:"шт", sum: st.price*c.q}; }
    const st = stops[c.i];
    const pr = STOP_PRICE[c.f];
    return {k, type:"s", f:c.f, name:st.name, sub:`${FMT[c.f]} · ${pr.ml} мл`, q:c.q, unit:"шт", sum: pr.p*c.q};
  });
}
const ORDERS_KEY = "pa_orders";
function localOrders(){ try{ return JSON.parse(localStorage.getItem(ORDERS_KEY)||"[]"); }catch(e){ return []; } }
function saveLocalOrders(list){ try{ localStorage.setItem(ORDERS_KEY, JSON.stringify(list.slice(0,100))); }catch(e){} }
let storePromise = null;
function getStore(){
  if(!storePromise){
    storePromise = (async()=>{
      try{
        if(!window.claude || !window.claude.use) return null;
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        if(!db || !user) return null;
        const uid = await user.id();
        return uid ? {db, uid} : null;
      }catch(e){ return null; }
    })();
  }
  return storePromise;
}
function makeOrder(lines){
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    at: new Date().toISOString(),
    cust: {name: S.cust.name, phone: S.cust.phone, city: S.cust.city, comment: S.cust.comment},
    lines: lines.map(l=>({name:l.name, sub:l.sub, q:l.q, unit:l.unit, sum:l.sum})),
    total: cartTotal()
  };
}
async function saveOrder(order){
  saveLocalOrders([order, ...localOrders().filter(o=>o.id!==order.id)]);
  const st = await getStore();
  if(!st) return;
  try{ await st.db.collection("data/users/"+st.uid).doc("o"+order.id).set(order); }catch(e){}
}
async function loadOrders(){
  const local = localOrders();
  const st = await getStore();
  if(!st) return local;
  try{
    const snap = await st.db.collection("data/users/"+st.uid).get();
    const remote = snap.docs.filter(d=>d.exists && d.id.startsWith("o")).map(d=>d.data()).filter(Boolean);
    const byId = new Map();
    [...local, ...remote].forEach(o=>byId.set(o.id, o));
    const merged = [...byId.values()].sort((a,b)=>String(b.at).localeCompare(String(a.at)));
    saveLocalOrders(merged);
    return merged;
  }catch(e){ return local; }
}
function ordersHtml(list){
  if(!list.length) return "";
  const items = list.map(o=>`<div class="ordrow">
      <div><b>${new Date(o.at).toLocaleDateString("ru-RU")}</b><small>${o.lines.length} поз. · ${esc(o.cust && o.cust.name || "")}</small></div>
      <span>${fmt(o.total)}</span></div>`).join("");
  return `<h3>Мои заказы</h3>${items}`;
}
async function refreshOrders(){
  const box = document.getElementById("myorders");
  if(!box) return;
  const list = await loadOrders();

const MIN_OIL_SUM = 30000;   // минимум по маслам, ₸
const MIN_PCS = 20;          // минимум по парфюмам, шт
function minBlock(){
  const lines = cartLines();
  const oilSum = lines.filter(l=>l.type==="o").reduce((a,l)=>a+(l.sum||0),0);
  const pcs = lines.filter(l=>l.type==="s").reduce((a,l)=>a+l.q,0);
  const row = (label, cur, target, txt) => {
    const ok = cur >= target;
    const pct = Math.min(100, Math.round(cur / target * 100));
    const left = ok ? "Минимум выполнен" : "Не хватает: " + txt(target - cur);
    return `<div class="minrow ${ok?"ok":""}">
      <div class="mtxt"><span>${label}</span><b>${txt(cur)} из ${txt(target)}</b></div>
      <div class="mbar"><i style="width:${pct}%"></i></div>
      <small>${left}</small></div>`;
  };
  return `<div class="minbox">
    ${row("Масла, минимум 30 000 ₸", oilSum, MIN_OIL_SUM, fmt)}
    ${row("Парфюмы, минимум 20 шт", pcs, MIN_PCS, n => n + " шт")}
  </div>`;
}
function viewCart(){

        <label>Комментарий<textarea data-cust="comment" rows="2" placeholder="Пожелания по доставке или оплате">${esc(c.comment)}</textarea></label>
      </div>

function waLink(lines){
  const c = S.cust;
  const num = arr => arr.map((x,i)=>`${i+1}. ${x}`).join("\n");
  const oil  = lines.filter(l=>l.type==="o").map(l=>`${l.name} (${l.sub}) — ${l.q} мл${l.sum!==null?" — "+fmt(l.sum):""}`);
  const stAll = lines.filter(l=>l.type==="s");
  const stBlocks = FMT.map((name,fi)=>{
    const rows = stAll.filter(l=>l.f===fi).map(l=>`${l.name} — ${l.q} шт`);
    return rows.length ? "\n" + name.toUpperCase() + ":\n" + num(rows) + "\n" : "";
  }).join("");
  const sets = lines.filter(l=>l.type==="n").map(l=>`${l.name} — ${l.q} шт — ${fmt(l.sum)}`);
  let t = "Здравствуйте! Хочу оформить заказ Paradise Aroma.\n";
  t += "\nИмя: " + (c.name||"—") + "\nТелефон: " + (c.phone||"—");
  if(c.city) t += "\nГород / компания: " + c.city;
  if(c.comment) t += "\nКомментарий: " + c.comment;
  t += "\n";
  if(stAll.length) t += "\nПАРФЮМЫ:" + stBlocks + "\n";
  if(oil.length)  t += "\nМАСЛА НА РАЗЛИВ:\n" + num(oil) + "\n";
  if(sets.length) t += "\nНАБОРЫ:\n" + num(sets) + "\n";
  t += "\nИтого: " + fmt(cartTotal());
  return "https://wa.me/" + CONTACTS.whatsapp + "?text=" + encodeURIComponent(t);
}

// when the top bar changes height (collapse or new minimum status),
// move the page by the same amount so the cards stay where they are
let stickyRO = null, stickyLastH = null, ignoreScrollUntil = 0;
function observeSticky(){
  const el = document.querySelector(".stickytop");
  if(!el || !("ResizeObserver" in window)) return;
  stickyLastH = null;
  if(!stickyRO){
    stickyRO = new ResizeObserver(()=>{
      const e = document.querySelector(".stickytop");
      if(!e) return;
      const h = e.offsetHeight;
      if(stickyLastH !== null && h !== stickyLastH && window.scrollY > 0){
        ignoreScrollUntil = performance.now() + 120;   // this scroll is ours, not the user's
        window.scrollBy(0, h - stickyLastH);
      }
      stickyLastH = h;
    });
  }
  stickyRO.disconnect();
  stickyRO.observe(el);
}
// stock list: one shared document, keys "o|Name" (oil) and "s|Name|format" (perfume)
async function getDbOnly(){
  try{ if(!window.claude || !window.claude.use) return null; return await claude.use("db"); }catch(e){ return null; }
}
const BASE_STOP_COUNT = STOP.length;
function applyExtra(items){
  stops.length = BASE_STOP_COUNT;
  (items||[]).forEach(it=>{
    const i = stops.length;
    stops.push({id:"s"+i, i, name:it.name, ru:it.name, g:it.g, flags:[0,1,2].map(f=>false), extra:true});
  });
  S.extraItems = items || [];
}
function applyStock(set){
  oils.forEach(o=>{ o.out = set.has("o|"+o.name); });
  stops.forEach(st=>{ st.flags = [0,1,2].map(f=>set.has("s|"+st.name+"|"+f)); });
}
const HAS_CLAUDE = !!window.claude;
async function fetchShared(){
  const r = await fetch("/api/data", {cache:"no-store"});
  if(!r.ok) throw new Error("read");
  return await r.json();
}
async function loadStock(){
  if(HAS_CLAUDE){
    const db = await getDbOnly();
    if(!db) return;
    try{
      const cat = await db.collection("catalog").doc("extra").get();
      applyExtra(cat.exists ? (cat.data().items||[]) : []);
      const snap = await db.collection("stock").doc("current").get();
      if(snap.exists) applyStock(new Set((snap.data().out)||[]));
      render();
    }catch(e){}
    return;
  }
  try{
    const d = await fetchShared();
    applyExtra(d.extra||[]);
    applyStock(new Set(d.out||[]));
    render();
  }catch(e){}
}
function currentStockSet(){
  const set = new Set();
  oils.forEach(o=>{ if(o.out) set.add("o|"+o.name); });
  stops.forEach(st=>[0,1,2].forEach(f=>{ if(st.flags[f]) set.add("s|"+st.name+"|"+f); }));
  return set;
}
function ownerToken(){
  if(!S.token){
    S.token = sessionStorage.getItem("pa_owner") || prompt("Пароль владельца для сохранения:") || "";
    if(S.token) sessionStorage.setItem("pa_owner", S.token);
  }
  return S.token;
}
// writes both lists; outSet is the stock set, items the extra perfumes
async function persist(outSet, items){
  if(HAS_CLAUDE){
    const db = await getDbOnly();
    if(!db) return {ok:false, msg:"Хранилище недоступно. Откройте страницу в аккаунте Claude."};
    try{
      await db.collection("catalog").doc("extra").set({items});
      await db.collection("stock").doc("current").set({out:[...outSet], updated:new Date().toISOString()});
      return {ok:true};
    }catch(e){ return {ok:false, msg:"Нет доступа: менять данные может только владелец страницы."}; }
  }
  const token = ownerToken();
  if(!token) return {ok:false, msg:"Нужен пароль владельца."};
  try{
    const r = await fetch("/api/data", {method:"POST", headers:{"Content-Type":"application/json","X-Owner-Token":token}, body: JSON.stringify({out:[...outSet], extra:items})});
    if(r.status === 403){ S.token = ""; sessionStorage.removeItem("pa_owner"); return {ok:false, msg:"Неверный пароль владельца."}; }
    if(!r.ok) return {ok:false, msg:"Не удалось сохранить. Попробуйте ещё раз."};
    return {ok:true};
  }catch(e){ return {ok:false, msg:"Нет связи с сервером. Проверьте интернет."}; }
}

  const r = await persist(S.stockSet, S.extraItems||[]);

async function addNewPerfume(){
  const name = (document.getElementById("npName").value||"").trim();
  const g = document.getElementById("npG").value;
  if(!name){ S.npMsg = "Введите название."; render(); return; }
  if(stops.some(x=>x.name.toLowerCase()===name.toLowerCase())){ S.npMsg = "Такой парфюм уже есть."; render(); return; }
  const flags = [0,1,2].map(f=>!document.querySelector(`[data-npf="${f}"]`).checked);
  const items = [...(S.extraItems||[]), {name, g, flags}];
  if(!S.stockSet) S.stockSet = currentStockSet();
  const next = new Set(S.stockSet);
  flags.forEach((off,f)=>{ if(off) next.add("s|"+name+"|"+f); });
  const r = await persist(next, items);
  if(!r.ok){ S.npMsg = r.msg; render(); return; }
  S.stockSet = next;
  applyExtra(items); applyStock(S.stockSet);
  S.npMsg = "Добавлено: " + name + ". Оно уже видно в каталоге.";
  render();
}
async function deleteExtra(k){
  const items = (S.extraItems||[]).filter((_,i)=>i!==k);
  const r = await persist(S.stockSet || currentStockSet(), items);
  if(!r.ok){ S.npMsg = r.msg; render(); return; }
  applyExtra(items); S.npMsg = "Удалено."; render();
}

function addToCart(k){
  const i = Number(k.slice(1));
  let added = null;
  if(k[0]==="o"){
    const amt = S.qty[k] || OIL_DEFAULT;
    added = {name: oils[i].name, q: amt, unit: "мл"};
    const key = "o"+i;
    cart[key] = {i, q: (cart[key]?cart[key].q:0) + amt};
  } else if(k[0]==="n"){
    const q = Math.max(1, Math.floor(Number(S.qty[k]||1)));
    added = {name: SETS[i].name, q, unit: "шт"};
    const key = "n"+i;
    cart[key] = {i, q: (cart[key]?cart[key].q:0) + q};
    S.qty[k] = 1;
  } else {
    const q = Math.max(1, Math.floor(Number(S.qty[k]||1)));
    const f = S.fmt;
    if(stops[i].flags[f]) return;
    added = {name: stops[i].name, q, unit: "шт", fmt: FMT[f]};
    const key = `s${i}-${f}`;
    cart[key] = {i, f, q: (cart[key]?cart[key].q:0) + q};
    S.qty[k] = 1;
  }
  saveCart(); render();
  feedbackAdded(k, added);
}
function feedbackAdded(k, added){
  if(!added) return;
  document.querySelectorAll(`[data-add="${k}"],[data-madd="${k}"]`).forEach(b=>{
    b.classList.remove("added"); void b.offsetWidth; b.classList.add("added");
  });
  const bd = document.getElementById("badge");
  if(bd){ bd.classList.remove("bump"); void bd.offsetWidth; bd.classList.add("bump"); }
  const count = cartLines().length;
  const what = `${added.name}${added.fmt ? " · " + added.fmt : ""} — ${added.q} ${added.unit}`;
  showToast(`Добавлено: ${what}. В корзине позиций: ${count}`);
}
let toastTimer = null;
function showToast(msg){
  let el = document.getElementById("toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2600);
}

function setCartQty(k, q){
  const min = k[0]==="o" ? OIL_MIN : 1;
  q = Math.floor(Number(q));
  if(!q) delete cart[k]; else cart[k].q = Math.max(min, q);   // масло не опускается ниже 30 мл; удаляет только «×»
  saveCart(); render();
}

    else if(g==="acc"||g==="sets"){ S.view="catalog"; S.cat=g; }

  }
  if(t.dataset.fmt!==undefined){ S.fmt = Number(t.dataset.fmt); S.panel = null; render(); return; }
  if(t.dataset.fall){ S.brands.clear(); S.supp.clear(); render(); return; }
  if(t.dataset.sidetog){ S.bopen = !S.bopen; render(); return; }
  if(t.dataset.cartmode){ S.cartMode = t.dataset.cartmode; render(); return; }
  if(t.dataset.stog){ const k=t.dataset.stog; S.stockSet.has(k) ? S.stockSet.delete(k) : S.stockSet.add(k); render(); return; }
  if(t.dataset.stab){ S.stockTab = t.dataset.stab; render(); return; }
  if(t.dataset.sfmt!==undefined){ S.stockFmt = Number(t.dataset.sfmt); render(); return; }
  if(t.dataset.stocksave){ saveStock(); return; }
  if(t.dataset.goview){ S.view = t.dataset.goview; S.npMsg = ""; S.stockMsg = ""; if(S.view==="stock") S.stockSet = null; render(); return; }
  if(t.dataset.addpsave){ addNewPerfume(); return; }

  if(t.dataset.back){ S.view = "catalog"; S.stockMsg = ""; if(location.hash==="#stock") history.replaceState(null,"",location.pathname); render(); return; }

    const set = t.dataset.fopt==="brands" ? S.brands : S.supp;

    if(set.has(v)) set.delete(v); else set.add(v);
    render(); return;
  }
  if(t.dataset.cat){ S.cat = t.dataset.cat; S.mode = "rows"; render(); return; }
  if(t.dataset.g){ S.g = t.dataset.g; render(); return; }
  if(t.dataset.mode){ S.mode = t.dataset.mode; render(); return; }
  if(t.dataset.cycle){ S.mode = {c2:"c3",c3:"list",list:"rows",rows:"c2"}[S.mode]; render(); return; }
  if(t.dataset.toggle){ S.showFilters = !S.showFilters; render(); return; }
  if(t.dataset.chip!==undefined){
    const k = t.dataset.chip, v = Number(t.dataset.val);

  }

    const k = t.dataset.step, d = Number(t.dataset.d);
    if(k[0]==="o"){ S.qty[k] = Math.max(OIL_MIN, (S.qty[k]||OIL_DEFAULT) + OIL_STEP*d); }
    else { S.qty[k] = Math.max(1, (S.qty[k]||1) + d); }

  if(t.dataset.cinc){ const k=t.dataset.cinc; setCartQty(k, cart[k].q + (k[0]==="o"?OIL_STEP:1)); return; }
  if(t.dataset.cdec){ const k=t.dataset.cdec; setCartQty(k, cart[k].q - (k[0]==="o"?OIL_STEP:1)); return; }
  if(t.dataset.crm){ delete cart[t.dataset.crm]; saveCart(); render(); return; }
  if(t.dataset.clear){ cart = {}; saveCart(); render(); return; }
});
document.getElementById("app").addEventListener("input", e=>{
  const t = e.target;
  if(t.id==="q"){ S.q = t.value; const pos=t.selectionStart; render(); const el=document.getElementById("q"); el.focus(); el.setSelectionRange(pos,pos); }
  if(t.dataset.cust){ cust[t.dataset.cust] = t.value; S.cust = cust; saveCust(); updateSendHref(); return; }
  if(t.dataset.qty){
    const k = t.dataset.qty, min = k[0]==="o"?OIL_MIN:1;
    S.qty[k] = Math.max(min, Math.floor(Number(t.value)||min));
  }
});
document.getElementById("app").addEventListener("click", e=>{
  const a = e.target.closest("#sendOrder");
  if(!a) return;
  const err = document.getElementById("formerr");
  if(!cust.name.trim() || !cust.phone.trim()){
    e.preventDefault();
    err.textContent = "Заполните имя и телефон, чтобы отправить заказ.";
    return;
  }
  err.textContent = "";
  const lines = cartLines();
  a.href = waLink(lines);
  saveOrder(makeOrder(lines)).then(()=>{ if(S.view==="cart") refreshOrders(); });
});
let lastY = 0;
window.addEventListener("scroll", ()=>{
  const y = window.scrollY;
  if(performance.now() < ignoreScrollUntil){ lastY = y; return; }
  if(S.view!=="catalog"){ lastY = y; return; }
  let changed = false;
  if(y > lastY + 6 && y > 160 && !S.tuck){ S.tuck = true; changed = true; }
  else if((y < lastY - 20 || y <= 160) && S.tuck){ S.tuck = false; changed = true; }
  if(changed){ const el = document.querySelector(".stickytop"); if(el) el.classList.toggle("tuck", S.tuck); }
  lastY = y;
  setStopH();
}, {passive:true});
document.addEventListener("transitionend", setStopH);
document.getElementById("app").addEventListener("change", e=>{
  const t = e.target;
  if(t.id==="sort"){ S.sort = t.value; render(); }
  if(t.dataset.cqty){ setCartQty(t.dataset.cqty, t.value); }
  if(t.dataset.qty){ render(); }
});
document.querySelectorAll("nav.bottom [data-nav]").forEach(b=>b.addEventListener("click",()=>{
  S.view = b.dataset.nav; render(); window.scrollTo(0,0);
}));

const BAKED = null;   // stock and new perfumes built in for the standalone copy (null on the Claude page)
if(BAKED){ applyExtra(BAKED.extra||[]); applyStock(new Set(BAKED.out||[])); }
if(location.hash === "#stock"){ S.view = "stock"; }
initFab();
render();
loadStock();
</script>
</body>
</html>
